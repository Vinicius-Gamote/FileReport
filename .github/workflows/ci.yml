name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NG_CLI_ANALYTICS: "false"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore FileReport.slnx --locked-mode --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format whitespace FileReport.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build FileReport.slnx --no-restore --configuration Release

      - name: Run tests
        run: >-
          dotnet test FileReport.slnx
          --no-build --no-restore
          --configuration Release

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/filereport-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/filereport-ui/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  system:
    name: PostgreSQL, RabbitMQ and deployed API
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: filereport-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DOTNET_ENVIRONMENT: Production
      RabbitMq__Host: 127.0.0.1
      RabbitMq__Port: "55672"
      RabbitMq__User: filereport
      Jwt__Issuer: FileReport
      Jwt__Audience: FileReport.Web
      Storage__Root: ${{ runner.temp }}
      Email__Mode: Fake
      Email__From: FileReport <reports@example.test>
      Email__ReportBaseUrl: http://localhost:8080
      Cors__Origin: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore and build test host
        run: |
          dotnet restore FileReport.slnx --locked-mode --configfile NuGet.Config
          dotnet build FileReport.slnx --no-restore --configuration Release

      - name: Generate isolated credentials
        shell: bash
        run: |
          database_secret=$(openssl rand -hex 32)
          broker_secret=$(openssl rand -hex 32)
          signing_key=$(openssl rand -hex 32)
          echo "::add-mask::$database_secret"
          echo "::add-mask::$broker_secret"
          echo "::add-mask::$signing_key"
          {
            echo "POSTGRES_PASSWORD=$database_secret"
            echo "RABBITMQ_PASSWORD=$broker_secret"
            echo "JWT_SIGNING_KEY=$signing_key"
            echo "ConnectionStrings__Database=Host=127.0.0.1;Port=55432;Database=filereport_tests;Username=filereport;Password=$database_secret"
            echo "RabbitMq__Password=$broker_secret"
            echo "Jwt__SigningKey=$signing_key"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL and RabbitMQ
        run: docker compose up -d --wait postgres rabbitmq

      - name: Prepare isolated test database
        run: docker compose exec -T postgres createdb -U filereport filereport_tests

      - name: Apply test database migrations
        run: dotnet run --project src/FileReport.Api --configuration Release --no-build -- --migrate

      - name: Run real-infrastructure tests
        env:
          RUN_INFRASTRUCTURE_TESTS: "1"
        run: >-
          dotnet test tests/FileReport.IntegrationTests
          --no-build --no-restore
          --configuration Release
          --filter FullyQualifiedName~InfrastructureTests

      - name: Build and start the complete stack
        run: docker compose up -d --build --wait

      - name: Run deployed API smoke test
        env:
          FILEREPORT_SMOKE_BASE_URL: http://127.0.0.1:5080
        run: >-
          dotnet test tests/FileReport.IntegrationTests
          --no-build --no-restore
          --configuration Release
          --filter FullyQualifiedName~DeployedApiTests

      - name: Stop isolated services
        if: always()
        shell: bash
        run: |
          if [[ -n "${POSTGRES_PASSWORD:-}" && -n "${RABBITMQ_PASSWORD:-}" && -n "${JWT_SIGNING_KEY:-}" ]]; then
            docker compose down --volumes --remove-orphans
          fi
