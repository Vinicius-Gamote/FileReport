name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NG_CLI_ANALYTICS: "false"

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.400

      - name: Restore locked dependencies
        run: dotnet restore FileReport.slnx --locked-mode --configfile NuGet.Config

      - name: Verify formatting
        run: dotnet format whitespace FileReport.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build FileReport.slnx --no-restore --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/filereport-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run colocated frontend tests
        run: npm test

  containers:
    name: Container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: filereport-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate validation-only Compose values
        shell: bash
        run: |
          database_secret=$(openssl rand -hex 32)
          broker_secret=$(openssl rand -hex 32)
          signing_key=$(openssl rand -hex 32)
          echo "::add-mask::$database_secret"
          echo "::add-mask::$broker_secret"
          echo "::add-mask::$signing_key"
          {
            echo "POSTGRES_PASSWORD=$database_secret"
            echo "RABBITMQ_PASSWORD=$broker_secret"
            echo "JWT_SIGNING_KEY=$signing_key"
          } >> "$GITHUB_ENV"

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api worker web
